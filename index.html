        <section id="gerenciarProduto">
            <article id="gerProd" class="article-functions-box">
                <p id="closeBtn">&times;</p>

                <h4>Gerenciar Produto</h4>

                <div class="menus">
                    <button id="insertProd">Cadastrar</button>
                    <button id="updateProd">Atualizar</button>
                    <button id="deleteProd">Remover</button>
                    <button id="selectProd">Consultar</button>
                </div>
                
                <form id="formCadProduto" action="" method="POST">
                    <h2>Cadastrar Produto</h2>

                    <div class="input-box">
                        <label>Código:</label>
                        <input type="number" name="codigo" placeholder="Ex.: 3" required>
                    </div>

                    <div class="input-box">
                        <label>Descrição:</label>
                        <input type="text" name="descricao" placeholder="Ex.: Feijão com farinha" required>
                    </div>

                    <div class="input-box">
                        <label>Valor (unitário):</label>
                        <input type="number" name="valor_unitario" placeholder="Ex.: 70" required>
                    </div>

                    <div class="input-box">
                        <label>Data de Validade:</label>
                        <input type="date" name="data_validade" required>
                    </div>

                    <input type="submit" value="Cadastrar" name="acao" class="submit-input">
                </form>

                <form id="formAtuaProduto" action="" method="POST">
                    <h2>Atualizar Produto</h2>

                    <div class="input-box">
                        <label>Código:</label>
                        <input type="number" name="codigo" placeholder="Ex.: 3" required>
                    </div>

                    <div class="input-box">
                        <label>Descrição:</label>
                        <input type="text" name="descricao" placeholder="Ex.: Feijão com farinha" required>
                    </div>

                    <div class="input-box">
                        <label>Valor (unitário):</label>
                        <input type="number" name="valor_unitario" placeholder="Ex.: 70">
                    </div>

                    <div class="input-box">
                        <label>Data de Validade:</label>
                        <input type="date" name="data_validade">
                    </div>

                    <input type="submit" value="Atualizar" name="acao" class="submit-input">
                </form>

                <form id="formRemoveProduto" action="" method="POST">
                    <h2>Remover Produto</h2>

                    <div class="input-box">
                        <label>Código:</label>
                        <input type="number" name="codigo" placeholder="Ex.: 3" required>
                    </div>

                    <!-- <div class="input-box">
                        <label>Descrição:</label>
                        <input type="text" name="descricao" placeholder="Ex.: Feijão com farinha" required>
                    </div>

                    <div class="input-box">
                        <label>Valor (unitário):</label>
                        <input type="number" name="valor_unitario" placeholder="Ex.: 70">
                    </div>

                    <div class="input-box">
                        <label>Data de Validade:</label>
                        <input type="date" name="data_validade">
                    </div> -->

                    <input type="submit" value="Remover" name="acao" class="submit-input">
                </form>

                <form id="formConsulProduto" action="" method="POST">
                    <h2>Consultar Produto</h2>

                    <div class="input-box">
                        <label>Código:</label>
                        <input type="number" name="codigo" placeholder="Ex.: 3" required>
                    </div>

                    <!-- <div class="input-box">
                        <label>Descrição:</label>
                        <input type="text" name="descricao" placeholder="Ex.: Feijão com farinha" required>
                    </div>

                    <div class="input-box">
                        <label>Valor (unitário):</label>
                        <input type="number" name="valor_unitario" placeholder="Ex.: 70">
                    </div>

                    <div class="input-box">
                        <label>Data de Validade:</label>
                        <input type="date" name="data_validade">
                    </div> -->

                    <input type="submit" value="Consultar" name="acao" class="submit-input">
                </form>
            </article>
        </section>
