<!DOCTYPE html>
<html lang="Pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="Assets/Css/login_style.css">
    <link rel="stylesheet" href="Assets/Css/loading_screen.css">
    <link rel="stylesheet" href="Assets/Css/notification.css">

</head>

<body>
    <div id="loading-screen">
        <div class="loader"></div>
    </div>
    <div id="notification-screen">
        <div class="notification"></div>
    </div>
    <h1>Sistema de Supermercado - PDV</h1>
    <div id="user_login">
        <form>
            <h2>Resetar Senha</h2>
            <p>Nova Senha:</p>

            <div class="password-container">
                <input class="user_input" type="password" name="user_password" id="New_password"  maxlength="16">
                <img src="Assets/Images/olho_ocult.png" alt="Assets/Images/olho_ocult.png" id="icon_eye2">
            </div>
            <p>Confirmar Senha:</p>

            <div class="password-container">
                <input class="user_input" type="password" name="user_password" id="New_password_Confirm"  maxlength="16">
                <img src="Assets/Images/olho_ocult.png" alt="Assets/Images/olho_ocult.png" id="icon_eye3">
            </div>
            <button class="confirm_button" type="submit" id="confirm">Confirmar</button>
        </form>
    </div>
    <script src="Assets/Script/reset_password.js"></script>
    <script src="Assets/Script/loading_screen.js"></script>
    <script src="Assets/Script/notification.js"></script>
</body>

</html>
