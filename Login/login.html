<!DOCTYPE html>
<html lang="Pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="Assets/Css/login_style.css">

</head>

<body>
    <h1>Sistema de Supermercado - PDV</h1>

    <div id="user_login">
        <form>
            <h2>Login</h2>
            <p>Identificador:</p>
            <input type="number" name="user_id" id="user_id" required>
            <p>Senha:</p>
            <div class="password-container">
                <input type="password" name="user_password" id="user_password" required>
                <img src="Assets/Images/olho_ocult.png" alt="Assets/Images/olho_ocult.png" id="icon_eye"
                    onclick="OcultarSenha()">
            </div>

            <a href="#" id="forgot_password">Esqueceu sua senha?</a>
            <button type="submit" id="confirm">Confirmar</button>
        </form>
    </div>
    <script src="Assets/Script/login.js"></script>
</body>

</html>
