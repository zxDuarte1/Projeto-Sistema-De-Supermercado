<!DOCTYPE html>
<html lang="Pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../Login/Assets/Css/login_style.css">
    <link rel="stylesheet" href="../Login/Assets/Css/loading_screen.css">
    <link rel="stylesheet" href="../Login/Assets/Css/notification.css">

</head>

<body>
    <div id="loading-screen">
        <div class="loader"></div>
    </div>
    <div id="notification-screen">
        <div class="notification"></div>
    </div>
    <h1>Sistema de Supermercado - PDV</h1>
    <div id="user_login">
        <form>
            <h2>Cadastro</h2>
            <p>Nome:</p>
            <input class="user_input" type="text" name="name" id="name" maxlength="100">
            <p>Email:</p>
            <input class="user_input" type="email" name="user_email" id="user_email" maxlength="100">
            <p>Telefone:</p>
            <input class="user_input" type="tel" name="user_phone" id="user_phone" maxlength="15">
            <p>Senha:</p>
            <div class="password-container">
                <input type="password" name="password" id="password" maxlength="16">
                <img src="Assets/Images/olho_ocult.png" alt="Assets/Images/olho_ocult.png" id="icon_eye">
            </div>

            <a href="../Login/login.html" id="forgot_password">Já tenho uma conta!</a>
            <button class="confirm_button" type="submit" id="button_register">Registrar</button>
        </form>
    </div>
    <script src="Assets/Script/Register.js"></script>
    <script src="../Login/Assets/Script/loading_screen.js"></script>
    <script src="../Login/Assets/Script/notification.js"></script>
</body>

</html>
